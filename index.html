<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LEGv8 Assembly UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div>
      <label for="src">LEGv8 Assembly:
        <textarea id="src" spellcheck="false">
main:
    ADDI X0,  XZR, #5    // X0 = 5
    ADD  X1,  XZR, XZR   // X1 = 0

forloop:
    ADD  X1,  X0,  X1    // X1 += X0
    SUBI X0,  X0,  #1    // X0 -= 1
    CBNZ X0,  forloop    // if X0 <> 0, jump to start of forloop

exit:
        </textarea>
      </label>
      <div class="controls">
        <button id="step">Run Step</button>
      </div>
      <div class="current-instr">
        <label for="current-instr-text" id="current-instr-label">Current instruction:
          <span id="current-instr-comment"></span>
        </label>
        <span id="current-instr-text">&mdash;</span>
        <b>Registers set:</b>
        <span id="current-instr-registers" class="regs">&mdash;</span>
      </div>
    </div>
    <div class="registers">
      <span>Registers</span>
      <div id="regs" class="regs"></div>
    </div>
  </div>
</div>
<script src="src/main.js" type="module"></script>
</body>
</html>
